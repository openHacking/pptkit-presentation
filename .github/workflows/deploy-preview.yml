name: Deploy presentation preview

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-preview.yml"
      - "apps/preview/**"
      - "packages/presentation-workflow/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter presentation-workflow build
      - run: pnpm --filter presentation-preview build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/preview/dist
      - id: deployment
        uses: actions/deploy-pages@v4
